name: Build VPK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rules + AI tests
        run: |
          cc -O2 -std=c99 -Wall -Iinclude tests/test_logic.c src/game_logic.c src/ai.c -o test_logic
          ./test_logic

  vpk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with VitaSDK (official Docker image)
        run: |
          docker run --rm -v "$PWD":/src -w /src vitasdk/vitasdk:latest sh -c '
            set -e
            command -v cmake >/dev/null || apk add --no-cache cmake make
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
          '
          ls -la build/*.vpk
      - uses: actions/upload-artifact@v4
        with:
          name: Battleship-vpk
          path: build/Battleship.vpk
          if-no-files-found: error
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Battleship.vpk
